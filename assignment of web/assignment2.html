<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Quest</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    /* Base Reset */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #1a1a2e;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    padding: 10px;
}

/* Game Header */
.game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: #16213e;
    padding: 15px 20px;
    margin: 10px;
    border: 2px solid #0f3460;
    border-radius: 10px;
    gap: 20px;
}

.game-header h1 {
    font-size: 1.5rem;
    color: #e94560;
}

.game-info {
    display: flex;
    gap: 20px;
    font-weight: bold;
}

.header-actions {
    display: flex;
    gap: 10px;
}

/* Main Layout Wrapper */
main {
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin: 0 10px;
    flex: 1;
}

/* Game Area */
.game-area {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background-color: #0f4c75;
    padding: 30px;
    border: 2px solid #3282b8;
    border-radius: 10px;
    gap: 15px;
    min-height: 250px;
}

.game-message {
    background-color: #bbe4e9;
    color: #1f4068;
    padding: 8px 15px;
    border: 2px solid #3282b8;
    border-radius: 6px;
    font-weight: bold;
}

.player {
    background-color: #f0a500;
    color: #1a1a2e;
    padding: 10px 20px;
    border-radius: 6px;
    font-weight: bold;
}

.star {
    background-color: #ffcc00;
    color: #1a1a2e;
    padding: 10px 20px;
    border-radius: 6px;
    font-weight: bold;
}

.platform {
    background-color: #3282b8;
    color: #fff;
    padding: 8px 25px;
    border-radius: 6px;
    font-weight: bold;
}

.platforms-row {
    display: flex;
    gap: 30px;
}

/* Game Panels Section */
.game-panels {
    display: flex;
    gap: 20px;
}

.panel {
    flex: 1;
    background-color: #16213e;
    padding: 20px;
    border: 2px solid #0f3460;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.panel h2 {
    font-size: 1.2rem;
    border-bottom: 2px solid #0f3460;
    padding-bottom: 8px;
    color: #e94560;
}

/* Controls Panel */
.controls {
    align-items: center;
}

.control-row {
    display: flex;
    justify-content: center;
    gap: 10px;
}

button, .jump-btn {
    background-color: #0f3460;
    color: white;
    border: 2px solid #e94560;
    padding: 10px 15px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

button:hover, .jump-btn:hover {
    background-color: #e94560;
}

.jump-btn {
    width: 100%;
}

/* Inventory Panel */
.inventory-items {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.item {
    flex: 1 1 40%;
    background-color: #0f3460;
    padding: 15px;
    border: 2px solid #3282b8;
    border-radius: 8px;
    text-align: center;
    font-weight: bold;
}

/* Quest Panel */
.quest-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: #0f3460;
    padding: 12px;
    border-radius: 6px;
    border: 1px solid #3282b8;
}

/* Footer */
footer {
    text-align: center;
    padding: 15px;
    margin-top: 10px;
    font-size: 0.9rem;
    color: #a0a0a0;
}

/* Responsive Media Query */
@media (max-width: 768px) {
    .game-header {
        flex-direction: column;
        align-items: flex-start;
    }

    .game-info {
        flex-wrap: wrap;
        gap: 10px;
    }

    .game-panels {
        flex-direction: column;
    }
}
</style>
<body>

    <!-- Game Header -->
    <header class="game-header">
        <h1>Flexbox Quest</h1>
        <div class="game-info">
            <span>Lives: 3</span>
            <span>Coins: 120</span>
            <span>Level: 1</span>
        </div>
        <div class="header-actions">
            <button>Pause</button>
            <button>Menu</button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main>
        <!-- Game Area Section -->
        <section class="game-area">
            <div class="game-message">Collect all the stars!</div>
            <div class="player">PLAYER</div>
            <div class="star">STAR</div>
            <div class="platform">PLATFORM</div>
            <div class="platforms-row">
                <div class="platform">PLATFORM</div>
                <div class="platform">PLATFORM</div>
            </div>
        </section>

        <!-- Game Panels Row Section -->
        <section class="game-panels">
            <!-- Controls Panel -->
            <div class="panel controls">
                <h2>Controls</h2>
                <div class="control-row">
                    <button>↑</button>
                </div>
                <div class="control-row">
                    <button>←</button>
                    <button>↓</button>
                    <button>→</button>
                </div>
                <button class="jump-btn">Jump</button>
            </div>

            <!-- Inventory Panel -->
            <div class="panel inventory">
                <h2>Inventory</h2>
                <div class="inventory-items">
                    <div class="item">Sword</div>
                    <div class="item">Shield</div>
                    <div class="item">Potion</div>
                    <div class="item">Key</div>
                </div>
            </div>

            <!-- Quest Panel -->
            <div class="panel quest">
                <h2>Quest</h2>
                <div class="quest-item">
                    <span>Collect 3 Stars</span>
                    <span>1 / 3</span>
                </div>
                <div class="quest-item">
                    <span>Find the Golden Key</span>
                    <span>0 / 1</span>
                </div>
                <div class="quest-item">
                    <span>Defeat the Monster</span>
                    <span>0 / 1</span>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Flexbox Quest Lab. All rights reserved.</p>
    </footer>

</body>
</html>
